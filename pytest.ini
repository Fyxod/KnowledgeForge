[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use mocked services)
    e2e: End-to-end tests (full stack simulation)
    slow: Slow tests that may take >5s
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = -v --strict-markers --tb=short -ra
