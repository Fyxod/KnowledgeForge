name: Docker

on:
  push:
    branches:
      - main
      - agent/fix-docker-stack
    paths:
      - .dockerignore
      - .env.docker
      - .github/workflows/docker.yml
      - Dockerfile
      - docker-compose.yml
      - docker-entrypoint.sh
      - nginx/**
      - requirements-docker.txt
      - scripts/docker-smoke.sh
      - agent/**
      - app/**
      - core/**
      - frontend/**
  pull_request:
    paths:
      - .dockerignore
      - .env.docker
      - .github/workflows/docker.yml
      - Dockerfile
      - docker-compose.yml
      - docker-entrypoint.sh
      - nginx/**
      - requirements-docker.txt
      - scripts/docker-smoke.sh
      - agent/**
      - app/**
      - core/**
      - frontend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke-test Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare container environment
        run: cp .env.docker .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build current images
        run: docker compose build --pull --progress=plain

      - name: Start stack and wait for health
        run: docker compose up --detach --wait --wait-timeout 600

      - name: Run application smoke test
        run: ./scripts/docker-smoke.sh

      - name: Inspect runtime
        run: |
          docker compose ps
          docker compose exec -T app python -c "import torch; print(f'torch={torch.__version__} cuda={torch.cuda.is_available()}')"
          docker compose exec -T app nginx -t

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
