name: CI/CD with Local Docker and SSH Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image Locally
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image (locally cached)
        run: |
          docker build -t samsung:latest -t samsung:${{ steps.vars.outputs.sha_short }} .

  deploy:
    name: Deploy Locally Built Image
    runs-on: self-hosted
    needs: build

    steps:
      - name: Stop and Remove old container if exists
        run: |
          docker stop samsung || true
          docker rm samsung || true

      - name: Run updated container
        run: |
          cd /home/kerito/
          docker run -d \
            --name samsung \
            --env-file .env \
            --dns=8.8.8.8 \
            -p 8080:8080 -p 8000:8000 \
            -v $(pwd)/data:/data \
            samsung:latest