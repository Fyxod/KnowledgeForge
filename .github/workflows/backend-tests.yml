# ==============================================================================
# GitHub Actions CI — Run tests on every push/PR
# ==============================================================================
name: Backend Tests

on:
  workflow_dispatch: # Manual trigger only — re-enable auto triggers below when ready
  # push:
  #   branches: [main, develop]
  #   paths:
  #     - "**/*.py"
  #     - ".github/workflows/backend-tests.yml"
  #     - "requirements*.txt"
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - "**/*.py"
  #     - ".github/workflows/backend-tests.yml"
  #     - "requirements*.txt"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      DATABASE_URL: mongodb://localhost:27017/test_bedrock
      DATABASE_NAME: test_bedrock
      SECRET_KEY: ci-test-secret-key
      MODE: test
      API_KEY_1: ci-key-1
      API_KEY_2: ci-key-2
      API_KEY_3: ci-key-3
      API_KEY_4: ci-key-4
      API_KEY_5: ci-key-5
      API_KEY_6: ci-key-6
      OPENAI_API: ci-openai
      QUERY_URL: http://localhost:11434
      VISION_URL: http://localhost:11435
      MAIN_MODEL: test-model
      REMOTE_GPU: "false"
      USE_VISION_MODEL: "false"
      LOCAL_BASE_URL: http://localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run all tests with coverage
        run: |
          python -m pytest -v --tb=short \
            --cov --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

      - name: Check coverage threshold
        run: |
          python -m pytest --cov --cov-fail-under=75 --no-header -q || \
          echo "::warning::Coverage below 75% threshold"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check app/ core/ agent/ --output-format=github
